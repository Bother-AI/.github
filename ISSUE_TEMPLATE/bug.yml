name: 🐛 버그
description: 동작이 기대와 다를 때
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: input
    id: env
    attributes:
      label: 환경
      description: 기기 · OS 버전 · 앱/커밋 버전
