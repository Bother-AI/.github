name: ✨ 기능
description: 기능 명세서 기반 구현 작업
title: "feat: "
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: 기능 ID
      description: 기능 명세서의 ID (예: CALL-C2-01)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 만들고, 완료 기준은 무엇인지
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 세부 작업
      value: |
        - [ ]
  - type: input
    id: notion
    attributes:
      label: Notion 작업 보드 링크
